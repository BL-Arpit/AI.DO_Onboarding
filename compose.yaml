services:
  app:
    build: .
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_PATH: /project/data/onboarding.sqlite
      TRUSTED_HOSTS: "${TRUSTED_HOSTS},127.0.0.1"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["app_data:/project/data"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  app_data:
