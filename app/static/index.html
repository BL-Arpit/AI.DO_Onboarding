<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1b293d;font:16px system-ui}header{background:white;border-bottom:1px solid #e2e7ee;padding:18px 5%;display:flex;justify-content:space-between;gap:16px}main{max-width:1080px;padding:0 18px;margin:24px auto}section{background:white;border:1px solid #e1e5ed;border-radius:14px;padding:22px;margin-bottom:18px}h1,h2{font-size:22px;margin:0 0 16px}h3{font-size:17px}input,button,select{font:inherit;border-radius:8px;border:1px solid #ccd4e0;padding:10px;max-width:100%}button{background:#235bd0;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:flex;flex-direction:column;gap:5px;font-size:14px}form,.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}a{color:#235bd0;overflow-wrap:anywhere}.muted{color:#66768a;font-size:14px}.bubble{background:#edf3ff;padding:12px;border-radius:10px;margin:10px 0;overflow-wrap:anywhere}.bubble.user{background:#f0f2f6;margin-left:30px}.bubble.assistant{margin-right:30px}#chatlog{max-height:470px;overflow:auto}#notice{position:sticky;top:0;background:#fff0c9;padding:12px;z-index:2;display:none}#workspace{display:none}.row{display:block;width:100%;text-align:left;background:white;color:#1b293d;margin-bottom:8px}.split{display:grid;grid-template-columns:300px 1fr;gap:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e4e8ef;padding:9px;overflow-wrap:anywhere}fieldset{border:1px solid #dce2ec;border-radius:8px;margin:12px 0}fieldset label{margin:10px 0}fieldset input{width:100%}.tag{display:inline-block;background:#e9effa;padding:3px 7px;border-radius:6px;font-size:13px}#empty{color:#66768a} @media(max-width:740px){.split{grid-template-columns:1fr}header{padding:16px}section{padding:16px}main{padding:0 10px}#account{font-size:13px}.bubble.user{margin-left:12px}.bubble.assistant{margin-right:12px}}
</style></head><body><header><strong>Onboarding</strong><span id="account"></span></header><div id="notice" role="status"></div><main>
<section id="login"><h1>Hi, welcome</h1><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<section id="activation" hidden><h1>Set your password</h1><form id="activationForm"><label>New password<input name="password" type="password" required minlength="16" autocomplete="new-password"></label><button>Activate account</button></form></section>
<div id="workspace"><section><h1 id="greeting">Hi, welcome</h1><div class="tools"><button id="add">Add person</button><button id="uploadExcel">Upload Excel</button><a href="/api/employees/export">Export Excel</a><button id="manage" hidden>Users and roles</button><button id="passwordButton" hidden>Password</button><button id="logout">Sign out</button></div>
<div id="chatlog" aria-live="polite"></div><form id="chatForm"><input name="message" placeholder="Type add, or add Ravi Kumar, ravi@example.com, 9876543210" aria-label="Message" required style="flex:1;min-width:180px"><button>Send</button></form>
<div id="excelPanel" hidden><form id="excelForm"><label>Excel file<input name="file" type="file" accept=".xls,.xlsx" required></label><label>Worksheet (optional)<input name="sheet_name" placeholder="First worksheet by default"></label><button>Preview</button></form><div id="preview"></div></div><p id="emailStatus" class="muted" hidden></p><button id="retryEmail" hidden>Retry emails</button></section>
<div class="split"><section><h2>People</h2><div id="employees"></div></section><section id="detail"><p id="empty">Choose a person.</p></section></div>
<section id="usersPanel" hidden><h2>Users and roles</h2><p class="muted">In chat: add user name: Neha email: neha@example.com role: hr_admin</p><div id="users"></div></section>
<section id="passwordPanel" hidden><h2>Change password</h2><form id="passwordForm"><label>Current password<input name="old_password" type="password" required></label><label>New password<input name="new_password" type="password" minlength="16" required></label><button>Save</button></form></section></div>
</main><script src="/app.js" defer></script></body></html>
