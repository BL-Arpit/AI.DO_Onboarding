<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIDO · Onboarding</title><style>
*{box-sizing:border-box}body{margin:0}input,button,select{font:inherit;border-radius:8px;padding:10px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:flex;flex-direction:column;gap:5px;font-size:14px}form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}h1,h2{font-size:22px;margin:0 0 16px}h3{font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.bubble{overflow-wrap:anywhere}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid;padding:9px;overflow-wrap:anywhere}fieldset{border:1px solid;border-radius:8px;margin:12px 0}fieldset label{margin:10px 0}fieldset input{width:100%}.tag{display:inline-block;padding:3px 7px;border-radius:6px;font-size:13px}.tools{display:flex;flex-wrap:wrap;margin:14px 0;align-items:center}.row{display:block;width:100%;text-align:left;margin-bottom:8px}#workspace{display:none}:root{color-scheme:dark}body{background:#212121;color:#ececec;font:15px system-ui}header{height:58px;background:#212121;border:0;padding:16px 24px;align-items:center}header strong{font-size:18px;font-weight:550}main{max-width:none;margin:0;padding:0;height:calc(100dvh - 58px)}section{background:transparent;border:0;margin:0;padding:0}#workspace{height:100%;display:none}#sidebar{background:#171717;position:absolute;top:58px;bottom:0;width:240px;padding:18px 12px;display:flex;flex-direction:column;gap:22px;overflow:auto}#conversation{margin-left:240px;height:100%;display:flex;flex-direction:column;position:relative;padding:12px 28px 20px}#conversation>section:first-child{display:contents}#greeting{text-align:center;margin:15vh 0 28px;font-size:30px;font-weight:500}#chatlog{flex:1;max-height:none;overflow:auto;padding:18px max(0px,calc((100% - 780px)/2));scrollbar-width:thin}#chatlog:empty{flex:1}#chatForm{order:10;flex-wrap:nowrap;width:min(800px,100%);margin:12px auto 0;padding:9px;background:#303030;border:1px solid #424242;border-radius:26px;align-items:center}#chatForm input{background:transparent;border:0;outline:none;min-width:0!important}#chatForm button{border:0;border-radius:50%;padding:6px 12px;font-size:22px}#chatForm button:last-child{background:#ececec;color:#171717}input,select{background:#303030;color:#eee;border:1px solid #555}button{background:#303030;color:#eee;border:1px solid #484848}button:hover{background:#414141}a{color:#b4d8ff}.tools{justify-content:center;gap:8px}.tools button,.tools a{font-size:13px;padding:9px 13px;border-radius:20px;text-decoration:none}.bubble{padding:16px 0;border-radius:0;background:transparent;line-height:1.6;margin:8px 0;white-space:pre-wrap}.bubble.user{background:#303030;border-radius:22px;padding:12px 18px;max-width:85%;width:fit-content;margin:12px 0 16px auto}.bubble.assistant{margin-right:0}.bubble pre{white-space:pre-wrap}.bubble table{white-space:normal}.muted{color:#aaa}#sidebar button{border:0;background:transparent;text-align:left;border-radius:8px;padding:10px;width:100%}#sidebar button:hover,#sidebar button.active{background:#303030}#conversations{display:flex;flex-direction:column;gap:4px}#sidebarPeople{margin-top:auto}#employees{max-height:240px;overflow:auto}#employees[hidden]{display:none}#sidebar .row{font-size:13px;color:#ccc}#accountTools{display:flex;flex-wrap:wrap}#accountTools button{font-size:12px;width:auto}#detail,#excelPanel,#usersPanel,#passwordPanel{max-width:780px;width:100%;margin:12px auto;padding:18px;border:1px solid #454545;border-radius:16px;background:#252525}#chatlog #detail,#chatlog #excelPanel{width:100%}fieldset{border-color:#555}th,td{border-color:#484848}.tag{background:#3b3b3b}#notice{position:fixed;top:58px;right:16px;max-width:480px;background:#46372a;color:#fff;border-radius:12px}#notice:empty{display:none}#dropHint{position:absolute;inset:15px;background:#212121ed;border:2px dashed #aaa;border-radius:24px;z-index:5;place-content:center;text-align:center;font-size:22px;pointer-events:none}#dropHint:not([hidden]){display:grid}#attachmentsStatus{order:11;font-size:12px;text-align:center;color:#aaa}#login,#activation{max-width:380px;margin:15vh auto;padding:24px}#login form,#activation form{display:grid}#login input,#activation input{width:100%}[hidden]{display:none!important}#emailStatus,#retryEmail{display:none!important}@media(max-width:740px){#sidebar{width:155px;padding:12px 6px}#conversation{margin-left:155px;padding:8px 12px 16px}header{padding:14px}#account{font-size:11px}#greeting{font-size:24px}#detail,#excelPanel{padding:12px}.tools{gap:5px}.tools button{font-size:12px}#chatlog{padding:8px 0}}@media(max-width:480px){#sidebar{width:112px}#conversation{margin-left:112px;padding:6px 8px}#sidebar button{font-size:12px;padding:8px 5px}#greeting{font-size:20px}header #account{max-width:50%;overflow:hidden;white-space:nowrap}.bubble.user{max-width:95%}}

/* Visual treatment adapted from the supplied AIDO Chat frontend. */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}#sidebar{width:264px;top:0;padding:0;border-right:1px solid #3d3d3d;gap:0}#chatHeader{display:flex;align-items:center;justify-content:space-between;margin-left:264px;height:54px;border-bottom:1px solid #3d3d3d;padding:0 16px;gap:10px}#chatHeader strong{font-size:14px;flex:1}#account{font-size:12px;color:#9a9a9a}.modelBadge{border:1px solid #3d3d3d;border-radius:999px;padding:6px 11px;font-size:12px;color:#9a9a9a}main{height:calc(100dvh - 54px)}#conversation{margin-left:264px;padding:0 20px 18px;min-width:0}.side-head{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;font-size:15px;min-height:54px}.side-head img{border-radius:7px}#sidebar #newChat{margin:4px 12px 10px;width:calc(100% - 24px);padding:9px 12px;border:1px solid #3d3d3d;border-radius:9px;font-size:13.5px}#sidebar #newChat:hover{border-color:#7c6cff;background:#7c6cff24}#conversations{padding:0 8px;flex:1;overflow:auto;gap:1px}#conversations button{font-size:13.5px;color:#9a9a9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#conversations button.active{background:#2a2a2a;color:#ececec}#sidebarPeople{margin:0;padding:10px 12px}#accountTools{border-top:1px solid #3d3d3d;padding:10px 12px}#accountTools button{color:#9a9a9a}#greeting{margin:0 auto;padding:9vh 20px 12px;text-align:center}#greeting img{border-radius:14px;margin-bottom:18px}#greeting h1{font-size:26px;margin:0;font-weight:600}#conversation .tools{max-width:720px;width:100%;margin:12px auto;gap:10px}#conversation>section>.tools{justify-content:center}#conversation>section>.tools button{border:1px solid #3d3d3d;border-radius:12px;padding:13px 15px;background:transparent;font-size:13.5px;font-weight:500;flex:1;text-align:left}#conversation .tools button:hover{border-color:#7c6cff;background:#7c6cff24}#chatlog{min-height:0;padding:24px max(0px,calc((100% - 780px)/2)) 12px}.bubble{font-size:14.5px;line-height:1.6}.bubble.user{border-radius:18px;padding:10px 16px;max-width:78%;background:#2f2f2f}.bubble.assistant{padding-left:40px;position:relative}.bubble.assistant:before{content:"";position:absolute;left:0;top:18px;width:28px;height:28px;background:url('/favicon.svg') center/contain no-repeat}#chatForm{max-width:780px;align-items:flex-end;border-radius:24px;padding:8px 8px 8px 12px;background:#2f2f2f;border-color:#3d3d3d}#chatForm:focus-within{border-color:#7c6cff}#chatForm textarea{flex:1;min-width:0;background:transparent;color:#ececec;border:0;outline:none;resize:none;max-height:200px;padding:6px 0;line-height:1.5;font-size:14.5px}#chatForm button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0}#chatForm button:last-child{background:#7c6cff;color:white;font-size:19px}#chatForm button:last-child:hover{background:#9382ff}#attach{background:transparent}#menuToggle{display:none;background:transparent;border:0;padding:5px}button:focus-visible,a:focus-visible{outline:2px solid #9382ff;outline-offset:3px}#detail input:focus-visible{outline:2px solid #9382ff}#detail input{min-width:0}#chatTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:740px){#sidebar{width:264px;z-index:20;transform:translateX(-100%);transition:transform .15s}body.sidebar-open #sidebar{transform:translateX(0)}#chatHeader{margin-left:0}#menuToggle{display:block}#conversation{margin-left:0;padding:0 12px 12px}#account{display:none}#chatlog{padding:12px 0}#greeting{padding-top:12vh}#sidebar .side-head{padding-right:50px}#sidebarClose{position:absolute;right:12px;top:14px;width:28px!important;padding:4px!important}#conversation>section>.tools button{font-size:12px;padding:12px 10px}}@media(min-width:741px){#sidebarClose{display:none}}
#sidebar #newChat{display:flex;align-items:center;gap:8px}.scroll table{min-width:580px}#chatlog table td,#chatlog table th{word-break:normal}</style></head><body><header id="chatHeader"><button id="menuToggle" type="button" aria-label="Toggle conversations"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><strong id="chatTitle">New conversation</strong><span id="account"></span><span class="modelBadge">Local ANN</span></header><div id="notice" role="status"></div><main>
<section id="login"><h1>Hi, welcome</h1><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<section id="activation" hidden><h1>Set your password</h1><form id="activationForm"><label>New password<input name="password" type="password" required minlength="16" autocomplete="new-password"></label><button>Activate account</button></form></section>
<div id="workspace"><aside id="sidebar"><div class="side-head"><img src="/favicon.svg" alt="" width="26" height="26"><strong>AIDO Chat</strong></div><button id="newChat"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button><button id="sidebarClose" type="button" aria-label="Close conversations">×</button><nav id="conversations" aria-label="Conversations"></nav><div id="sidebarPeople"><button id="peopleToggle">People</button><div id="employees"></div></div><div id="accountTools"></div></aside><div id="conversation"><section><div id="greeting"><img src="/favicon.svg" alt="" width="52" height="52"><h1>Hi, welcome</h1></div><div class="tools"><button id="add">Add person</button><button id="uploadExcel">Upload Excel</button><a href="/api/employees/export">Export Excel</a><button id="manage" hidden>Users and roles</button><button id="passwordButton" hidden>Password</button><button id="logout">Sign out</button></div>
<div id="dropHint" hidden>Drop Excel files or documents here</div><div id="chatlog" aria-live="polite"></div><form id="chatForm"><button type="button" id="attach" aria-label="Attach files"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><textarea name="message" placeholder="Message…" aria-label="Message" rows="1" required></textarea><button aria-label="Send message"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></form><input id="attachments" type="file" accept=".xls,.xlsx,.pdf,image/*" multiple hidden><div id="attachmentsStatus" role="status"></div>
<div id="excelPanel" hidden><form id="excelForm"><label>Excel file<input name="file" type="file" accept=".xls,.xlsx" required></label><label>Worksheet (optional)<input name="sheet_name" placeholder="First worksheet by default"></label><button>Preview</button></form><div id="preview"></div></div><p id="emailStatus" class="muted" hidden></p><button id="retryEmail" hidden>Retry emails</button></section>
<section id="detail" hidden></section>
<section id="usersPanel" hidden><h2>Users and roles</h2><p class="muted">In chat: add user name: Neha email: neha@example.com role: hr_admin</p><div id="users"></div></section>
<section id="passwordPanel" hidden><h2>Change password</h2><form id="passwordForm"><label>Current password<input name="old_password" type="password" required></label><label>New password<input name="new_password" type="password" minlength="16" required></label><button>Save</button></form></section></div>
</div></main><script src="/app.js" defer></script></body></html>
