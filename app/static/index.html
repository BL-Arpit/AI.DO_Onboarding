<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI.DO</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head><body>
<div id="notice" role="alert" hidden></div>
<main id="loginView"><div class="wordmark">AI.DO</div><h1>Welcome</h1><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Sign in</button></form></main>
<div id="workspace" hidden><aside id="sidebar"><div class="side-head"><strong class="wordmark">AI.DO</strong><button id="closeSidebar" aria-label="Close conversations">×</button></div><button id="newChat">＋ New chat</button><nav id="conversations" aria-label="Conversations"></nav><footer><button id="master">Master sheet</button><button id="account">Account</button><button id="logout">Sign out</button></footer></aside>
<section id="chatMain"><header><button id="menu" aria-label="Open conversations">☰</button><strong id="chatTitle">New conversation</strong></header><div id="chatlog" aria-live="polite"><div id="welcome"><div class="wordmark">AI.DO</div><h1>Hi, welcome</h1><div class="suggestions"><button id="add">Add employee</button><button id="showMaster">View master sheet</button></div></div></div>
<form id="composer"><button id="attach" type="button" aria-label="Attach files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><textarea name="message" aria-label="Message" placeholder="Message…" rows="1" required></textarea><button id="send" aria-label="Send message" class="primary"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9Z"/></svg></button></form>
<input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,.xls,.xlsx" multiple hidden><div id="progress" role="status"></div><div id="dropHint" hidden>Drop documents or Excel here</div></section></div>
<script src="/assets/app.js" defer></script></body></html>
